<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SV2026</title>

  <!-- (Opcional) evitar indexación -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1 class="valentine-title">¿Te gusta?</h1>
      <p class="sub">Un trocito de mí cada día.</p>
    </header>

    <section class="card valentine-card">
      <div class="meta valentine-meta" id="date"></div>
      <div class="text valentine-text" id="text"></div>
          <section class="reply">
  <h2>¿Quieres decirme algo?</h2>

  <form action="https://formspree.io/f/mvzbejre" method="POST">
    <textarea 
      name="message" 
      placeholder="Escríbeme lo que quieras"
      required>
    </textarea>

    <button type="submit">Enviar :P</button>
  </form>
</section>
      <footer class="foot valentine-foot">
        <span class="dot"></span>
        <span>babyboy.</span>
        <span class="mini-counter" id="miniCounter"></span>
      </footer>
    </section>

    <!-- Corazoncito debajo, un poco a la derecha -->
    <div class="valentine-heart" aria-hidden="true">❤</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
